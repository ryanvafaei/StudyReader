name: StudyReader
options:
  bundleIdPrefix: com.ryanvafaei
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: "597KGSTZWJ"
    CODE_SIGN_STYLE: Automatic
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
  configs:
    Debug:
      DEAD_CODE_STRIPPING: NO
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.11.1
  swift-markdown:
    url: https://github.com/swiftlang/swift-markdown
    from: 0.9.0
  FSRS:
    url: https://github.com/open-spaced-repetition/swift-fsrs
    from: 5.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 10.1.0
targets:
  StudyReader:
    type: application
    platform: macOS
    sources:
      - path: StudyReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryanvafaei.StudyReader
        PRODUCT_NAME: StudyReader
    info:
      path: StudyReader/Resources/Info.plist
      properties:
        CFBundleDisplayName: StudyReader
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.education
        # Dock and Finder "Open With" activate the running copy instead of starting a second library window (T48 fix).
        LSMultipleInstancesProhibited: true
        GIDClientID: "$(GOOGLE_CLIENT_ID)"
        CFBundleURLTypes:
          - CFBundleURLName: GoogleSignIn
            CFBundleURLSchemes:
              - "$(GOOGLE_REVERSED_CLIENT_ID)"
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [net.daringfireball.markdown]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown]
              public.mime-type: [text/markdown]
    entitlements:
      path: StudyReader/Resources/StudyReader.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.network.client: true
        keychain-access-groups:
          - "$(AppIdentifierPrefix)com.ryanvafaei.StudyReader"
    dependencies:
      - package: GRDB
      - package: swift-markdown
        product: Markdown
      - package: FSRS
      - package: GoogleSignIn
  StudyReaderTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: StudyReaderTests
        excludes:
          - "Fixtures/**"
      - path: StudyReaderTests/Fixtures
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - target: StudyReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryanvafaei.StudyReaderTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/StudyReader.app/Contents/MacOS/StudyReader"
        BUNDLE_LOADER: "$(TEST_HOST)"
  # XCUITests for the visual checkpoints (ADR-0019). Separate scheme so ./scripts/test.sh never takes over the screen.
  # The tests launch the app with -StudyReaderInMemory, so they never open the user's library (ADR-0011).
  StudyReaderUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: StudyReaderUITests
    dependencies:
      - target: StudyReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryanvafaei.StudyReaderUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: StudyReader
schemes:
  StudyReader:
    build:
      targets:
        StudyReader: all
        StudyReaderTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StudyReaderTests
      shouldUseLaunchSchemeArgsEnv: false
      environmentVariables:
        STUDYREADER_IN_MEMORY: "1"
  StudyReaderUITests:
    build:
      targets:
        StudyReader: all
        StudyReaderUITests: [test]
    test:
      config: Debug
      targets:
        - StudyReaderUITests
